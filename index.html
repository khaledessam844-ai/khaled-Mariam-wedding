<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4eadb"><meta name="description" content="Khaled & Mariam invite you to celebrate their wedding on 6 November 2026."><title>Khaled & Mariam | Wedding Invitation</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');
:root{--gold:#aa7b3c;--cream:#f7eee0;--ink:#685339}*{box-sizing:border-box}html{min-height:100%;background:#f4eadb}body{margin:0;min-height:100svh;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;background:radial-gradient(ellipse at 50% 18%,#fffaf3,#e8d7bd 100%);overflow-x:hidden}.screen{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 15px 46px;position:relative}.screen:before,.screen:after{content:'❧';position:absolute;color:#ac895c;opacity:.42;font-size:85px;pointer-events:none}.screen:before{top:0;left:12px;transform:rotate(-28deg)}.screen:after{bottom:0;right:12px;transform:rotate(150deg)}.eyebrow{font-size:14px;letter-spacing:.3em;text-transform:uppercase;text-align:center;margin:0 0 24px}.heading{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(42px,9vw,70px);color:#9d7135;text-align:center;margin:0 0 18px}.envelope-wrap{width:min(90vw,490px);height:min(58vw,320px);max-height:320px;perspective:1200px;position:relative;filter:drop-shadow(0 18px 20px #6e4e2b35);cursor:pointer;outline-offset:8px}.envelope{position:absolute;inset:0;background:#e5cfad;border:1px solid #c9ad83;border-radius:5px;overflow:visible}.envelope:before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,#fff8e8,#e4caa5);clip-path:polygon(0 0,50% 55%,100% 0);z-index:2;transform-origin:top;transition:transform 1.15s ease,z-index 0s .55s;backface-visibility:hidden}.envelope:after{content:'';position:absolute;inset:0;background:linear-gradient(145deg,#efdec4,#d5b98e);clip-path:polygon(0 100%,50% 47%,100% 100%);z-index:3}.side{position:absolute;inset:0;background:#e9d1ab;clip-path:polygon(0 0,50% 55%,0 100%);z-index:3}.side.right{transform:scaleX(-1)}.seal{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);width:75px;height:75px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6b575,#9a692b);border:3px double #e9d09a;box-shadow:0 3px 9px #7c582d55;display:grid;place-items:center;color:#fff7e5;font-size:30px;z-index:5;transition:opacity .5s,transform .6s}.letter{position:absolute;width:87%;height:94%;left:6.5%;bottom:3%;background:#fffaf2;border:2px solid #c9a36b;box-shadow:0 2px 12px #5b402b22;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1;transition:transform 1.4s .55s ease}.letter span{font-family:'Great Vibes',cursive;font-size:clamp(35px,7vw,52px);color:#a6793d}.letter small{letter-spacing:.18em;font-size:13px;margin-top:12px}.opened .envelope:before{transform:rotateX(180deg);z-index:0}.opened .seal{opacity:0;transform:translate(-50%,-80%) scale(.5)}.opened .letter{transform:translateY(-43%)}.hint{font-size:17px;letter-spacing:.1em;margin:29px 0 0;text-align:center}.btn{font-family:inherit;letter-spacing:.13em;text-transform:uppercase;font-size:14px;padding:14px 25px;background:#a37b47;color:white;border:1px solid #a37b47;border-radius:30px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:background .2s}.btn:hover{background:#856032}.openbtn{margin-top:18px}.invite{display:none;min-height:100svh;align-items:center;flex-direction:column;padding:25px 15px 55px;animation:reveal 1.3s ease both}.invite.visible{display:flex}@keyframes reveal{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}.invite h1{font-family:'Great Vibes',cursive;font-size:clamp(45px,9vw,72px);font-weight:400;color:#9f743d;margin:4px 0 12px}.invite img{width:min(100%,1000px);height:auto;display:block;border:1px solid #cba76e;box-shadow:0 15px 40px #70502a2b}.details{text-align:center;padding:25px 0 10px}.details h2{font-weight:500;font-size:28px;margin:0}.details p{font-size:19px;margin:8px 0 22px}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.secondary{background:transparent;color:#906b3d}.secondary:hover{color:white}.foot{font-size:16px;margin-top:30px;letter-spacing:.08em}.music{position:fixed;top:15px;right:15px;z-index:10;border-radius:50%;height:44px;width:44px;border:1px solid #c8a36b;background:#fff9e9d9;color:#8b6332;cursor:pointer;font-size:21px;display:none}.music.show{display:block}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main><section class="screen" id="intro"><p class="eyebrow">Together with our families</p><h1 class="heading">Khaled &amp; Mariam</h1><div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Open wedding invitation"><div class="envelope"><div class="letter"><span>Khaled &amp; Mariam</span><small>6 NOVEMBER 2026</small></div><div class="side"></div><div class="side right"></div><div class="seal">K<span style="font-size:18px;padding:0 3px">&amp;</span>M</div></div></div><p class="hint">A special invitation awaits you</p><button class="btn openbtn" id="open">Open Invitation ✉</button></section><section class="invite" id="invite"><h1>Khaled &amp; Mariam</h1><img src="invitation.jpg" alt="Khaled and Mariam wedding invitation, 6 November 2026, 5 PM to 8 PM, Taracina Hall"/><div class="details"><h2>Friday, 6 November 2026</h2><p>5:00 PM – 8:00 PM · Taracina Hall, Maadi</p><div class="actions"><a class="btn" href="https://maps.app.goo.gl/b4Ps73jU14SKgfcV6?g_st=ic" target="_blank" rel="noopener noreferrer">⌖ &nbsp; Get Directions</a><button class="btn secondary" id="share">↗ &nbsp; Share Invitation</button></div></div><p class="foot">We can't wait to celebrate with you ♡</p></section></main><script>
const intro=document.getElementById('intro'),invite=document.getElementById('invite'),envelope=document.getElementById('envelope');
let opened=false;
const weddingMusic=new Audio('wedding-music.mp3');
weddingMusic.loop=true;
weddingMusic.preload='auto';
function startMusic(){weddingMusic.play().catch(()=>{});}
function openInvite(){if(opened)return;opened=true;envelope.classList.add('opened');document.getElementById('open').disabled=true;startMusic();setTimeout(()=>{intro.style.display='none';invite.classList.add('visible');window.scrollTo(0,0)},1900)}
document.getElementById('open').addEventListener('click',openInvite);envelope.addEventListener('click',openInvite);envelope.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvite()}});document.getElementById('share').addEventListener('click',async()=>{const data={title:'Khaled & Mariam Wedding Invitation',text:'Join us on 6 November 2026 at Taracina Hall!',url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert('Invitation link copied!')}else{prompt('Copy this invitation link:',location.href)}});
</script></body></html>
