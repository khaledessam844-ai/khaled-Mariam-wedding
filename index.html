</style></head><body><main><section class="screen" id="intro"><p class="eyebrow">Together with our families</p><h1 class="heading">Khaled &amp; Mariam</h1><div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Open wedding invitation"><div class="envelope"><div class="letter"><span>Khaled &amp; Mariam</span><small>6 NOVEMBER 2026</small></div><div class="side"></div><div class="side right"></div><div class="seal"><span>K</span><span style="font-size:17px">&amp;</span><span>M</span></div></div></div><p class="hint">A special invitation awaits you</p><button class="btn openbtn" id="open">Open Invitation ✉</button></section><section class="invite" id="invite"><h1>Khaled &amp; Mariam</h1><img src="invitation.jpg" alt="Khaled and Mariam wedding invitation, 6 November 2026, 4 PM to 8 PM, Taracina Hall"/><div class="details"><h2>Friday, 6 November 2026</h2><p>4:00 PM – 8:00 PM · Taracina Hall</p><div class="actions"><a class="btn" href="https://www.google.com/maps/search/?api=1&query=29.8936620%2C31.0572650" target="_blank" rel="noopener noreferrer">⌖ &nbsp; View Location</a><button class="btn secondary" id="share">↗ &nbsp; Share Invitation</button></div></div><p class="foot">We can't wait to celebrate with you ♡</p></section></main><audio id="weddingMusic" src="wedding-music.mp3" preload="auto" loop playsinline webkit-playsinline></audio><script>
const intro=document.getElementById('intro'),invite=document.getElementById('invite'),envelope=document.getElementById('envelope');
let opened=false;
const weddingMusic=document.getElementById('weddingMusic');
function startMusic(){
  weddingMusic.muted=false;
  weddingMusic.volume=1;
  const attempt=weddingMusic.play();
  if(attempt && typeof attempt.catch==='function'){
    attempt.catch(()=>{
      // Some iPhone browsers require another direct tap to allow audio.
      const btn=document.getElementById('open');
      btn.disabled=false;
      btn.textContent='Tap to play music ♡';
      btn.style.position='fixed';
      btn.style.bottom='18px';
      btn.style.zIndex='20';
      btn.addEventListener('click',function retry(){
        weddingMusic.play().then(()=>btn.remove()).catch(()=>{});
      },{once:true});
    });
  }
}
function openInvite(){
  if(opened)return;
  opened=true;
  // iOS: start audio synchronously INSIDE the user's tap handler.
  startMusic();
  envelope.classList.add('opened');
  document.getElementById('open').disabled=true;
  setTimeout(()=>{intro.style.display='none';invite.classList.add('visible');window.scrollTo(0,0)},1900);
}
document.getElementById('open').addEventListener('click',openInvite);envelope.addEventListener('click',openInvite);envelope.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvite()}});document.getElementById('share').addEventListener('click',async()=>{const data={title:'Khaled & Mariam Wedding Invitation',text:'Join us on 6 November 2026 at Taracina Hall!',url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert('Invitation link copied!')}else{prompt('Copy this invitation link:',location.href)}});
</script><!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "cf1064c9b39a452fa7e4571be7dffe5c"}'></script><!-- End Cloudflare Web Analytics --></body></html>
